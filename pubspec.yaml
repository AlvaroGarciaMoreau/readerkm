name: readerkm
description: "Lectura de kilometraje y consumo de combustible, para dar gastos en viajes."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.0+1
  google_mlkit_text_recognition: ^0.15.1
  permission_handler: ^12.0.1
  path_provider: ^2.1.1
  image_picker: ^1.0.4
  shared_preferences: ^2.2.2
  http: ^1.5.0
  http_parser: ^4.0.2
  uuid: ^4.5.3
  path: ^1.8.3
  mime: ^2.0.0
  google_fonts: ^8.0.2
  image: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
